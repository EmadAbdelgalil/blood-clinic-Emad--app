name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Init Capacitor
        run: |
          npx cap init "عيادة الدم" "com.hospital.bloodclinic" --web-dir=.
          npx cap add android
          npx cap sync

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blood-clinic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
